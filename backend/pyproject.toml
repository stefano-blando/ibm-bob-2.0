[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nagare-governor"
version = "0.1.0"
description = "Active Steering & Scope Interceptor for Autonomous Coding Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    "networkx>=3.0",
]

[project.scripts]
nagare = "nagare.cli:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
